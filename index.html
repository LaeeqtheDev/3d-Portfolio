    <!--
      Fonts moved out of index.css. An @import inside CSS blocks rendering
      until the stylesheet is parsed AND the font CSS is fetched — two
      serialised round trips. Doing it here with preconnect starts the
      handshake immediately.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Work+Sans:wght@400;500&display=swap"
    />

    <!-- Draco decoder for the compressed .glb models -->
    <link rel="dns-prefetch" href="https://www.gstatic.com" />
